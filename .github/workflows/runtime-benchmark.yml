on:
  push:
    branches:
      - dev
    paths:
      - "runtime/**/*.ts"
      - "runtime/**/package.json"
      - "lib/**/*"

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: styfle/cancel-workflow-action@0.9.1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build benchmark files
        run: |
          bun i --production
          bun runtime:build

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Node 22 benchmark
        run: bun runtime:start --runtime node

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - name: Node 24 benchmark
        run: bun runtime:start --runtime node

      - uses: actions/setup-node@v4
        with:
          node-version: latest
      - name: Node latest benchmark
        run: bun runtime:start --runtime node

      - name: Bun benchmark
        run: bun runtime:start --runtime bun

      - uses: denoland/setup-deno@v2.0.3
        with:
          deno-version: lts
      - name: Deno LTS benchmark
        run: bun runtime:start --runtime deno

      - uses: denoland/setup-deno@v2.0.3
        with:
          deno-version: latest
      - name: Deno latest benchmark
        run: bun runtime:start --runtime deno

      - name: Render results
        run: bun result

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "update runtime results"

      - name: Push with retry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in {1..10}; do
            git pull --rebase origin ${{ github.ref_name }}

            if git push origin HEAD:${{ github.ref_name }}; then
              echo "Push succeeded"
              exit 0
            fi

            echo "Push failed, retry $i..."
            sleep 3
          done

          echo "Push failed after retries"
          exit 1
