on:
  push:
    branches:
      - dev
    paths:
      - "runtime/**/*.ts"
      - "runtime/**/package.json"

jobs:
  update-node-results:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Deno
        uses: denoland/setup-deno@v2.0.3
        with:
          deno-version: lts

      - name: Install dependencies
        run: bun i

      - name: Build benchmark files
        run: bun runtime:build

      - name: Node 22 setup
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Node 22 benchmark
      - run: bun runtime:start --runtime node

      - name: Node 23 setup
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Node 24 benchmark
      - run: bun runtime:start --runtime node

      - name: Bun benchmark
        run: bun runtime:start --runtime bun

      - name: Deno benchmark
        run: bun runtime:start --runtime deno

      - name: Update result.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add result.json
          git commit -m "update results"
          git push origin HEAD:${{ github.ref_name }}
