on:
  push:
    branches:
      - dev
    paths:
      - 'runtime/**/*.ts'
      - 'runtime/**/package.json'
      - 'lib/**/*'

concurrency:
  group: benchmark

jobs:
  update-results:
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: styfle/cancel-workflow-action@0.9.1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build benchmark files
        run: |
          bun i --production
          bun runtime:build

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Node 22 benchmark
        run: bun runtime:start --runtime node

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Node 24 benchmark
        run: bun runtime:start --runtime node

      - uses: actions/setup-node@v4
        with:
          node-version: latest
      - name: Node latest benchmark
        run: bun runtime:start --runtime node

      - name: Bun benchmark
        run: bun runtime:start --runtime bun

      - uses: denoland/setup-deno@v2.0.3
        with:
          deno-version: lts
      - name: Deno LTS benchmark
        run: bun runtime:start --runtime deno

      - uses: denoland/setup-deno@v2.0.3
        with:
          deno-version: latest
      - name: Deno latest benchmark
        run: bun runtime:start --runtime deno

      - name: Render results
        run: bun result

      - name: Update results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "update runtime results"
          git pull origin HEAD:${{ github.ref_name }} --rebase
          git push origin HEAD:${{ github.ref_name }}
