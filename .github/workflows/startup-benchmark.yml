on:
  push:
    branches:
      - dev
    paths:
      - "startup/**/*.ts"
      - "startup/**/package.json"
      - "lib/**/*"

jobs:
  update-results:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: benchmark
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build benchmark files
        run: |
          bun i --production
          bun startup:build

      - name: Node 22 setup
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Node 22 benchmark
        run: bun startup:start --runtime node

      - name: Node 24 setup
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - name: Node 24 benchmark
        run: bun startup:start --runtime node

      - name: Node latest setup
        uses: actions/setup-node@v4
        with:
          node-version: latest
      - name: Node latest benchmark
        run: bun startup:start --runtime node

      - name: Bun benchmark
        run: bun startup:start --runtime bun

      - name: Setup Deno LTS
        uses: denoland/setup-deno@v2.0.3
        with:
          deno-version: lts
      - name: Deno LTS benchmark
        run: bun startup:start --runtime deno

      - name: Setup Deno latest
        uses: denoland/setup-deno@v2.0.3
        with:
          deno-version: latest
      - name: Deno latest benchmark
        run: bun startup:start --runtime deno

      - name: Update result.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add result.json
          git commit -m "update startup results"
          git push origin HEAD:${{ github.ref_name }}
