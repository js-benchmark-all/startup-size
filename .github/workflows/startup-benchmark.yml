on:
  push:
    branches:
      - dev
    paths:
      - "startup/**/*.ts"
      - "startup/**/package.json"
      - "lib/**/*"

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: styfle/cancel-workflow-action@0.9.1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install deps
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun i --production

      ## Node 22
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Node 22 benchmark
        run: |
          bun startup:build --runtime node
          bun startup:start --runtime node

      ## Node 24
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - name: Node 24 benchmark
        run: |
          bun startup:build --runtime node
          bun startup:start --runtime node

      ## Node latest
      - uses: actions/setup-node@v4
        with:
          node-version: latest
      - name: Node latest benchmark
        run: |
          bun startup:build --runtime node
          bun startup:start --runtime node

      # Bun
      - name: Build benchmark for Bun
        run: bun startup:build --runtime bun
      - name: Bun benchmark
        run: bun startup:start --runtime bun

      ## Deno LTS
      - uses: denoland/setup-deno@v2.0.3
        with:
          deno-version: lts
      - name: Deno LTS benchmark
        run: |
          bun startup:build --runtime deno
          bun startup:start --runtime deno

      ## Deno latest
      - uses: denoland/setup-deno@v2.0.3
        with:
          deno-version: latest
      - name: Deno latest benchmark
        run: |
          bun startup:build --runtime deno
          bun startup:start --runtime deno

      # Render results
      - name: Render results
        run: bun result

      ## Update result
      - name: Update results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "update startup results"
          git fetch
          git rebase ${{ github.ref_name }}
          git push origin ${{ github.ref_name }}
